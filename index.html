<script>
const CLOUD_URL='https://reilqxvnkqmmeqtsuqgq.supabase.co',CLOUD_KEY='sb_publishable_vhQc7xKDkNyWvXVxBkZdIw_tdaPwSNN',CLOUD_ROW='shared',REVIEW_DAYS=[1,2,4,7,15,30],PERIODS=[['01','08:00','08:45'],['02','08:50','09:35'],['03','09:50','10:35'],['04','10:40','11:25'],['05','11:30','12:15'],['06','14:00','14:45'],['07','14:50','15:35'],['08','15:40','16:25'],['09','16:40','17:25'],['10','17:30','18:15'],['11','19:30','20:15'],['12','20:20','21:05'],['13','21:10','21:55']];
const $=id=>document.getElementById(id);let today=beijingToday(),selected=new Date(today),plans=normalizePlans(read('plans-v3',{})),classes=read('classes-v1',{}),memories=normalizeMemories(read('memory-v2',[])),pushTimer=0,remoteSig='',pendingSig='',pushBusy=false,pullBusy=false,localRevision=0,deferredRender=false,pointerHeld=false;
function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}
function normalizeMemories(a){const fallback=key(beijingToday());return Array.isArray(a)?a.map((m,i)=>Object.assign({name:'',start:fallback,done:[]},m,{id:m.id||'legacy-memory-'+i,done:Array.isArray(m.done)?m.done:[]})):[]}function normalizePlans(a){const out={};Object.keys(a&&typeof a==='object'?a:{}).forEach(k=>{out[k]=Array.isArray(a[k])?a[k].map((x,i)=>Object.assign({time:'09:00',name:'',type:'学习'},x,{id:x.id||'legacy-plan-'+k+'-'+i})):[]});return out}
function beijingToday(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o=Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return new Date(Date.UTC(+o.year,+o.month-1,+o.day))}function strip(d){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}function key(d=selected){return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return key(new Date(Date.UTC(y,m-1,d+n)))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function rawSet(k,v){Storage.prototype.setItem.call(localStorage,k,JSON.stringify(v))}
function stateData(){return {'plans-v3':plans,'classes-v1':classes,'memory-v2':memories}}
function clone(v){return JSON.parse(JSON.stringify(v))}
let baseData=read('daily-plan-base',null)||clone(stateData());
function snapshot(){return JSON.stringify(stateData())}
function save(){localRevision++;rawSet('plans-v3',plans);rawSet('classes-v1',classes);rawSet('memory-v2',memories);localStorage.setItem('daily-plan-pending','1');pendingSig=snapshot();$('syncStatus').textContent=navigator.onLine?'同步中 · 已保存本地':'离线待同步 · 已保存本地';schedulePush()}
function schedulePush(delay=180){clearTimeout(pushTimer);pushTimer=setTimeout(push,delay)}
function planMap(data){const result=new Map();Object.entries(data?.['plans-v3']||{}).forEach(([date,items])=>{if(Array.isArray(items))items.forEach((item,i)=>result.set(item.id||'legacy-plan-'+date+'-'+i,{date,item:{...item,id:item.id||'legacy-plan-'+date+'-'+i}}))});return result}
function memoryMap(data){const result=new Map();(data?.['memory-v2']||[]).forEach((item,i)=>result.set(item.id||'legacy-memory-'+i,{...item,id:item.id||'legacy-memory-'+i}));return result}
function equal(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function mergedData(base,local,remote){
  const result=clone(remote||{}),bp=planMap(base),lp=planMap(local),rp=planMap(remote);
  for(const id of new Set([...bp.keys(),...lp.keys()]))if(!equal(bp.get(id),lp.get(id))){if(lp.has(id))rp.set(id,clone(lp.get(id)));else rp.delete(id)}
  const planDates=new Set([...Object.keys(result['plans-v3']||{}),...Object.keys(local['plans-v3']||{})]);result['plans-v3']=Object.fromEntries([...planDates].map(date=>[date,[]]));
  rp.forEach(({date,item})=>{(result['plans-v3'][date]??=[]).push(item)});
  const bc=base?.['classes-v1']||{},lc=local['classes-v1']||{},rc=clone(result['classes-v1']||{});
  for(const date of new Set([...Object.keys(bc),...Object.keys(lc)]))for(let i=0;i<13;i++)if(!equal(bc[date]?.[i],lc[date]?.[i])){const slots=rc[date]||[];slots[i]=clone(lc[date]?.[i]??{name:'',teacher:'',room:'',extra:'',active:false});rc[date]=slots}
  result['classes-v1']=rc;
  const bm=memoryMap(base),lm=memoryMap(local),rm=memoryMap(remote);
  for(const id of new Set([...bm.keys(),...lm.keys()])){
    const old=bm.get(id),now=lm.get(id);
    if(equal(old,now))continue;
    if(!now){rm.delete(id);continue}
    if(!old){rm.set(id,clone(now));continue}
    const merged={...(rm.get(id)||old)};
    for(const field of ['name','start'])if(!equal(old[field],now[field]))merged[field]=now[field];
    const done=new Set(merged.done||[]),before=new Set(old.done||[]),after=new Set(now.done||[]);
    for(const day of REVIEW_DAYS)if(before.has(day)!==after.has(day)){if(after.has(day))done.add(day);else done.delete(day)}
    merged.done=[...done].sort((a,b)=>a-b);rm.set(id,merged)
  }
  result['memory-v2']=[...rm.values()];return result
}
async function cloudRows(){const r=await fetch(CLOUD_URL+'/rest/v1/app_state?id=eq.'+encodeURIComponent(CLOUD_ROW)+'&select=data,updated_at',{headers:{apikey:CLOUD_KEY,Authorization:'Bearer '+CLOUD_KEY},cache:'no-store'});if(!r.ok)throw Error('读取云端失败 '+r.status);return r.json()}
async function push(){
  if(pushBusy||!pendingSig)return;pushBusy=true;
  const revision=localRevision,local=clone(stateData()),base=clone(baseData);
  try{
    for(let attempt=0;attempt<5;attempt++){
      const rows=await cloudRows(),row=rows[0],merged=mergedData(base,local,row?.data||{}),stamp=new Date().toISOString();
      let response;
      if(row){response=await fetch(CLOUD_URL+'/rest/v1/app_state?id=eq.'+encodeURIComponent(CLOUD_ROW)+'&updated_at=eq.'+encodeURIComponent(row.updated_at)+'&select=updated_at',{method:'PATCH',headers:{apikey:CLOUD_KEY,Authorization:'Bearer '+CLOUD_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({data:merged,updated_at:stamp})})}
      else{response=await fetch(CLOUD_URL+'/rest/v1/app_state',{method:'POST',headers:{apikey:CLOUD_KEY,Authorization:'Bearer '+CLOUD_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({id:CLOUD_ROW,data:merged,updated_at:stamp})})}
      if(!response.ok){if(!row&&response.status===409)continue;throw Error('写入云端失败 '+response.status)}
      const written=await response.json();if(!written.length)continue;
      baseData=clone(merged);rawSet('daily-plan-base',baseData);remoteSig=JSON.stringify(merged);
      if(revision===localRevision){plans=normalizePlans(merged['plans-v3']||{});classes=merged['classes-v1']||{};memories=normalizeMemories(merged['memory-v2']||[]);persistRemote();pendingSig='';localStorage.removeItem('daily-plan-pending');renderAll();$('syncStatus').textContent='已同步'}
      else{$('syncStatus').textContent='同步中 · 有新修改';pendingSig=snapshot()}
      return
    }
    throw Error('云端数据正在更新，请稍后重试')
  }catch(error){$('syncStatus').textContent='同步失败 · 修改已保存在本地';schedulePush(4000)}
  finally{pushBusy=false;if(pendingSig&&revision!==localRevision)schedulePush(180)}
}
async function pull(){
  if(pushBusy||pendingSig||pullBusy||localStorage.getItem('daily-plan-pending'))return;
  pullBusy=true;const revision=localRevision;
  try{const rows=await cloudRows(),data=rows[0]?.data;if(!data||revision!==localRevision||pendingSig)return;
    const sig=JSON.stringify(data);if(sig!==remoteSig){remoteSig=sig;baseData=clone(data);rawSet('daily-plan-base',baseData);plans=normalizePlans(data['plans-v3']||{});classes=data['classes-v1']||{};memories=normalizeMemories(data['memory-v2']||[]);persistRemote();renderAll()}
    $('syncStatus').textContent='已同步'
  }catch(error){$('syncStatus').textContent='离线或同步失败 · 本地记录可继续使用'}finally{pullBusy=false}
}
function persistRemote(){rawSet('plans-v3',plans);rawSet('classes-v1',classes);rawSet('memory-v2',memories)}
function semesterWeek(d){const fall=new Date(Date.UTC(2026,8,7)),spring=new Date(Date.UTC(2027,2,1)),fallEnd=new Date(Date.UTC(2027,0,3)),springEnd=new Date(Date.UTC(2027,5,27));if(d>=fall&&d<=fallEnd)return '第 '+(Math.floor((d-fall)/604800000)+1)+' 教学周';if(d>=spring&&d<=springEnd)return '第 '+(Math.floor((d-spring)/604800000)+1)+' 教学周';if(d>=new Date(Date.UTC(2026,7,24))&&d<fall)return '开学准备阶段';return '校历外日期'}
function renderHeader(){const d=selected;$('date').textContent=d.toLocaleDateString('zh-CN',{timeZone:'UTC',year:'numeric',month:'long',day:'numeric',weekday:'short'});$('week').textContent=semesterWeek(d);$('todayLabel').textContent=key(d)===key(strip(today))?'今天':key(d)<key(strip(today))?'以前的日期':'以后的日期';$('planTitle').textContent=key(d)===key(strip(today))?'今天的全部安排':d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+'的全部安排';$('scheduleTitle').textContent='当天课程表（'+d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+'）'}
function courseList(){const a=classes[key()]||[];return Array.from({length:13},(_,i)=>{const v=a[i];return typeof v==='string'?{name:v,teacher:'',room:'',extra:'',active:!!v}:Object.assign({name:'',teacher:'',room:'',extra:'',active:false},v||{})})}
function menuButton(id,items){return '<div class="action-wrap"><button class="more-btn" data-open-menu="'+id+'">操作</button><div class="action-menu" data-menu="'+id+'">'+items+'</div></div>'}
function renderSchedule(){const a=courseList();$('schedule').innerHTML=PERIODS.map((p,i)=>{const c=a[i],has=c.active||c.name||c.teacher||c.room||c.extra,actions=has?'<button data-edit-course="'+i+'">修改</button><button class="danger" data-delete-course="'+i+'">删除课程</button>':'<button data-add-course="'+i+'">添加课程</button>';return '<div class="period"><div class="period-head"><b>第'+p[0]+'节</b><small>'+p[1]+'-'+p[2]+'</small>'+menuButton('course-'+i,actions)+'</div>'+(has?'<div class="period-fields"><button type="button" class="btn" data-course-to-plan="'+i+'">加入当天学习计划</button><label>课程名称<input data-course="name" data-i="'+i+'" value="'+esc(c.name)+'" placeholder="填写课程名称"></label><label>任课老师<input data-course="teacher" data-i="'+i+'" value="'+esc(c.teacher)+'" placeholder="填写任课老师"></label><label>教室<input data-course="room" data-i="'+i+'" value="'+esc(c.room)+'" placeholder="填写教室"></label><label>补充信息<input data-course="extra" data-i="'+i+'" value="'+esc(c.extra)+'" placeholder="单双周、考试要求等"></label></div>':'<div class="period-head"><span class="hint">暂未安排课程</span></div>')+'</div>'}).join('')}
function renderPlans(){const list=(plans[key()]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time)),groups=['学习','锻炼','吃饭'];$('studyCount').textContent=list.filter(x=>x.type==='学习').length;$('exerciseCount').textContent=list.filter(x=>x.type==='锻炼').length;$('eatCount').textContent=list.filter(x=>x.type==='吃饭').length;$('planGroups').innerHTML=groups.map(g=>{const arr=list.filter(x=>x.type===g);return '<div class="plan-group"><h3>'+g+'计划（'+arr.length+'）</h3>'+(arr.length?arr.map(x=>'<div class="plan-item"><span>'+esc(x.name)+'</span><small>'+x.time+'</small>'+menuButton('plan-'+x.id,'<button data-edit-plan="'+x.id+'">修改</button><button class="danger" data-delete-plan="'+x.id+'">删除</button>')+'</div>').join(''):'<div class="hint">暂无安排</div>')+'</div>'}).join('')}
function renderMemories(){const rows=$('memoryRows');if(!memories.length){rows.innerHTML='<tr><td colspan="8" class="empty">还没有记忆内容</td></tr>';return}rows.innerHTML=memories.map(m=>'<tr><td><div class="memory-cell"><b>'+esc(m.name)+'</b>'+menuButton('memory-'+m.id,'<button data-edit-memory="'+m.id+'">修改内容</button><button class="danger" data-delete-memory="'+m.id+'">删除</button>')+'</div></td><td><div class="memory-cell"><small>首次学习</small><span>'+m.start+'</span></div></td>'+REVIEW_DAYS.map(d=>{const date=addDays(m.start,d),done=(m.done||[]).includes(d),action='<button data-toggle-memory="'+m.id+'" data-day="'+d+'">'+(done?'取消完成':'标记完成')+'</button>';return '<td class="'+(done?'memory-done':'')+'"><div class="memory-cell"><small>+'+d+'天复习</small><span>'+date+'</span>'+menuButton('review-'+m.id+'-'+d,action)+'</div></td>'}).join('')+'</tr>').join('')}
function renderNext(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()),o=Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value])),nowMin=(+o.hour)*60+(+o.minute),arr=(plans[key(today)]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time)),next=arr.find(x=>{const [h,m]=x.time.split(':').map(Number);return h*60+m>=nowMin});if(!next){$('nextName').textContent='暂无任务';$('countdown').textContent='—';$('nextTime').textContent='今天的安排已完成';return}const [h,m]=next.time.split(':').map(Number),diff=Math.max(0,(h*60+m-nowMin)*60000),mins=Math.floor(diff/60000),hours=Math.floor(mins/60);$('nextName').textContent=next.name;$('countdown').textContent=hours+'小时'+(mins%60)+'分钟';$('nextTime').textContent='开始时间 '+next.time}
function renderAll(){if(pointerHeld||document.activeElement?.matches("input,textarea,select")||document.querySelector(".action-menu.open")||$("editDialog").open){deferredRender=true;return;}renderHeader();renderSchedule();renderPlans();renderMemories();renderNext()}
document.addEventListener('pointerdown',()=>pointerHeld=true,true);
document.addEventListener('pointerup',()=>setTimeout(()=>{pointerHeld=false;if(deferredRender&&!document.activeElement?.matches('input,textarea,select')&&!document.querySelector('.action-menu.open')&&!$('editDialog').open){deferredRender=false;renderAll()}},0),true);
document.addEventListener('pointercancel',()=>pointerHeld=false,true);
$('prev').onclick=()=>{selected.setUTCDate(selected.getUTCDate()-1);renderAll()};$('next').onclick=()=>{selected.setUTCDate(selected.getUTCDate()+1);renderAll()};$('addPlan').onclick=()=>{const name=$('planName').value.trim();if(!name)return;$('planName').value='';(plans[key()]??=[]).push({id:uid(),time:$('planTime').value||'09:00',name,type:$('planType').value});save();renderPlans();renderNext()};$('addMemory').onclick=()=>{const name=$('memoryName').value.trim(),start=$('memoryDate').value;if(!name||!start)return;memories.push({id:uid(),name,start,done:[]});$('memoryName').value='';save();renderMemories()};
function closeMenus(){document.querySelectorAll('.action-menu.open').forEach(x=>x.classList.remove('open'))}
document.addEventListener('click',e=>{const open=e.target.closest('[data-open-menu]');if(open){const menu=open.closest('.action-wrap').querySelector('.action-menu'),show=!menu.classList.contains('open');closeMenus();if(show)menu.classList.add('open');return}if(!e.target.closest('.action-wrap'))closeMenus();const add=e.target.closest('[data-add-course]');if(add){const a=courseList();a[+add.dataset.addCourse].active=true;classes[key()]=a;save();renderSchedule();return}const courseToPlan=e.target.closest('[data-course-to-plan]');if(courseToPlan){const i=+courseToPlan.dataset.courseToPlan,c=courseList()[i];if(!c?.name?.trim()){$('syncStatus').textContent='请先填写课程名称';return}const date=key();(plans[date]??=[]).push({id:uid(),time:PERIODS[i][1],name:c.name.trim(),type:'学习'});save();renderPlans();renderNext();return}const editCourse=e.target.closest('[data-edit-course]');if(editCourse){closeMenus();document.querySelector('[data-course="name"][data-i="'+editCourse.dataset.editCourse+'"]')?.focus();return}const delCourse=e.target.closest('[data-delete-course]');if(delCourse){const date=key(),slot=+delCourse.dataset.deleteCourse;askDelete('确定删除这个时间段的课程吗？',()=>{const a=classes[date]||[];a[slot]={name:'',teacher:'',room:'',extra:'',active:false};classes[date]=a;save();renderSchedule()});return}const editPlan=e.target.closest('[data-edit-plan]');if(editPlan){const p=(plans[key()]||[]).find(x=>x.id===editPlan.dataset.editPlan);if(!p)return;openEditor('修改计划',p.name,(v,extra)=>{p.name=v;p.time=extra.time;p.type=extra.type;save();renderPlans();renderNext()},[{name:'time',label:'开始时间',type:'time',value:p.time},{name:'type',label:'计划类型',type:'select',value:p.type}]);return}const delPlan=e.target.closest('[data-delete-plan]');if(delPlan){const date=key(),id=delPlan.dataset.deletePlan;askDelete('确定删除这条计划吗？',()=>{plans[date]=(plans[date]||[]).filter(x=>x.id!==id);save();renderPlans();renderNext()});return}const editMem=e.target.closest('[data-edit-memory]');if(editMem){const m=memories.find(x=>x.id===editMem.dataset.editMemory);if(!m)return;openEditor('修改记忆',m.name,(v,extra)=>{m.name=v;m.start=extra.start;save();renderMemories()},[{name:'start',label:'首次学习日期',type:'date',value:m.start}]);return}const toggle=e.target.closest('[data-toggle-memory]');if(toggle){const m=memories.find(x=>x.id===toggle.dataset.toggleMemory);if(!m)return;m.done=m.done||[];const d=+toggle.dataset.day,i=m.done.indexOf(d);if(i<0)m.done.push(d);else m.done.splice(i,1);save();renderMemories();return}const dm=e.target.closest('[data-delete-memory]');if(dm){const id=dm.dataset.deleteMemory;askDelete('确定删除这条记忆及其复习记录吗？',()=>{memories=memories.filter(x=>x.id!==id);save();renderMemories()})}},false);
document.addEventListener('input',e=>{const field=e.target.closest('[data-course]');if(!field)return;const a=courseList(),i=+field.dataset.i;a[i][field.dataset.course]=field.value;a[i].active=true;classes[key()]=a;save()},false);


let editorCallback=null,editorOrigin=null,editorFields=[],composing=false,deleteMode=false;
function askDelete(title,callback){openEditor(title,'',()=>callback());deleteMode=true;$('dialogLabel').hidden=true;$('dialogValue').required=false;$('dialogSave').textContent='确认删除'}
function openEditor(title,value,callback,fields=[]){closeMenus();editorOrigin=document.activeElement;editorCallback=callback;editorFields=fields;deleteMode=false;$('dialogTitle').textContent=title;$('dialogValue').value=value;$('dialogValue').required=true;$('dialogLabel').hidden=false;$('dialogError').textContent='';$('dialogSave').textContent='保存';$('dialogExtra').innerHTML=fields.map(field=>'<label>'+esc(field.label)+(field.type==='select'?'<select name="'+field.name+'"><option value="学习"'+(field.value==='学习'?' selected':'')+'>学习</option><option value="锻炼"'+(field.value==='锻炼'?' selected':'')+'>锻炼</option><option value="吃饭"'+(field.value==='吃饭'?' selected':'')+'>吃饭</option></select>':'<input name="'+field.name+'" type="'+field.type+'" value="'+esc(field.value)+'" required>')+'</label>').join('');$('editDialog').showModal();$('dialogValue').focus()}
function closeEditor(){editorCallback=null;editorFields=[];deleteMode=false;$('dialogLabel').hidden=false;$('dialogValue').required=true;$('dialogExtra').replaceChildren();$('editDialog').close();editorOrigin?.focus?.()}
$('dialogCancel').onclick=closeEditor;
$('editDialog').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});
$('editDialog').addEventListener('compositionstart',()=>composing=true);
$('editDialog').addEventListener('compositionend',()=>composing=false);
$('editForm').addEventListener('submit',e=>{e.preventDefault();if(composing)return;const value=$('dialogValue').value.trim();if(!deleteMode&&!value){$('dialogError').textContent='请输入内容';$('dialogValue').focus();return}const extra={};for(const field of editorFields){const input=$('dialogExtra').querySelector('[name="'+field.name+'"]');if(!input?.value){$('dialogError').textContent='请填写'+field.label;input?.focus();return}extra[field.name]=input.value}const cb=editorCallback;closeEditor();cb?.(value,extra)});
if(localStorage.getItem('daily-plan-pending')){pendingSig=snapshot();schedulePush(100)}
window.addEventListener('online',()=>{if(pendingSig)schedulePush(0);else pull()});

document.addEventListener('click',()=>{setTimeout(()=>{if(deferredRender&&!document.activeElement?.matches('input,textarea,select')&&!document.querySelector('.action-menu.open')&&!$('editDialog').open){deferredRender=false;renderAll()}},0)});
function tick(){const current=beijingToday();if(key(current)!==key(today)){const showingToday=key(selected)===key(today);today=current;if(showingToday)selected=new Date(today);renderAll()}$('realDate').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());$('clock').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());renderNext()}$('memoryDate').value=key(strip(today));renderAll();tick();setInterval(tick,1000);setInterval(pull,2000);pull();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
