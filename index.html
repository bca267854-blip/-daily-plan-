<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的每日计划</title><style>
:root{--b:#3569e8;--ink:#172033;--muted:#718096;--bg:#f5f7fb;--card:#fff;--line:#e6ebf2;--green:#19a463}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.app{max-width:600px;margin:auto;padding:20px 16px 40px}.top,.days{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:var(--b);font-weight:800;font-size:12px;letter-spacing:1px}.top h1{margin:2px 0 0;font-size:27px}.clock{text-align:right;color:var(--muted);font-size:12px}.clock strong{display:block;color:var(--ink);font-size:22px}.days{gap:8px;margin:18px 0 14px}.days button{border:0;border-radius:9px;padding:8px 11px;background:#e8edf8;color:#52617a}.date{font-weight:800;font-size:17px}.hero{background:linear-gradient(135deg,#3468e8,#5b4ddd);color:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 28px #3156c530}.hero p{margin:0;color:#e5edff}.hero h2{margin:4px 0 8px;font-size:23px}.count{margin-top:15px;padding:11px;border:1px solid #ffffff45;border-radius:13px;background:#ffffff20}.count strong{display:block;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px}.card h2{font-size:17px;margin:0 0 10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.summary div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.summary b{display:block;color:var(--b);font-size:20px}.summary span,.hint,.period small{color:var(--muted);font-size:12px}.group-title{font-weight:800;margin:13px 0 4px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.task{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0}.task.done{opacity:.5}.task.done .name{text-decoration:line-through}.check{width:19px;height:19px;accent-color:var(--green)}.main{flex:1;min-width:0}.time{display:block;font-size:12px;color:var(--muted)}.name{display:block;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.del{border:0;background:transparent;color:#a0aec0;font-size:19px}.form{display:grid;grid-template-columns:82px 1fr 82px;gap:7px;margin-top:12px}.form input,.form select,.memory-form input,.period input{min-width:0;width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.add,.memory-form button{width:100%;height:38px;margin-top:8px;border:0;border-radius:9px;background:var(--b);color:#fff;font-weight:800}.hint{text-align:center;padding:10px}.schedule{display:grid;gap:6px}.period{display:grid;grid-template-columns:45px 106px 1fr 78px;gap:7px;align-items:center;border-top:1px solid var(--line);padding:7px 0}.period input{padding:7px}.period button,.memory-table button{border:0;border-radius:7px;padding:7px 5px;background:#eef2ff;color:var(--b);font-size:11px}.memory-form{display:grid;grid-template-columns:125px 1fr 65px;gap:7px;margin:10px 0 13px}.memory-form button{width:auto;margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.memory-table{border-collapse:collapse;width:760px;min-width:100%;font-size:12px}.memory-table th{background:#f5f8ff;color:var(--muted)}.memory-table th,.memory-table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.memory-table th:first-child,.memory-table td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}.memory-table .due{background:#fff4cf;color:#956200;font-weight:800}.memory-table .done{background:#e9f8f0;color:#16804d}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">MY DAILY PLAN</div><h1>每日计划</h1></div><div class="clock">当前时间<strong id="clock">--:--:--</strong></div></header><div class="days"><button id="prev">‹ 前一天</button><div id="date" class="date"></div><button id="next">后一天 ›</button></div><section class="hero"><p id="dayLabel">今天</p><h2 id="nextName">暂无任务</h2><p id="nextInfo">先添加安排</p><div class="count"><small>距离这项任务</small><strong id="countdown">—</strong></div></section><section class="summary"><div><b id="studyCount">0</b><span>学习</span></div><div><b id="exerciseCount">0</b><span>锻炼</span></div><div><b id="mealCount">0</b><span>吃饭</span></div></section><section class="card"><h2>当天课程表（空白课表）</h2><p class="hint">你可以按节次填写课程；点击“加入计划”后，课程才会进入当天计划。</p><div id="schedule" class="schedule"></div></section><section class="card"><h2 id="planTitle">今天的全部安排</h2><div id="groups"></div><div class="form"><input id="time" type="time" value="09:00"><input id="name" placeholder="填写计划内容"><select id="type"><option value="study">学习</option><option value="exercise">锻炼</option><option value="meal">吃饭</option></select></div><button id="add" class="add">＋ 添加到当前日期</button></section><section class="card"><h2>艾宾浩斯复习表</h2><p class="hint">填入哪天学了什么，系统自动算出后续复习日期。</p><div class="memory-form"><input id="memoryDate" type="date"><input id="memoryName" placeholder="例如：英语单词 Unit 1"><button id="addMemory">添加</button></div><div class="table-wrap"><table class="memory-table"><thead><tr><th>记忆内容</th><th>首次学习</th><th>+1天</th><th>+2天</th><th>+4天</th><th>+7天</th><th>+15天</th><th>+30天</th></tr></thead><tbody id="memoryRows"></tbody></table></div></section></main><script>
const periods=[['01','08:00','08:45'],['02','08:50','09:35'],['03','09:50','10:35'],['04','10:40','11:25'],['05','11:30','12:15'],['06','14:00','14:45'],['07','14:50','15:35'],['08','15:40','16:25'],['09','16:40','17:25'],['10','17:30','18:15'],['11','19:30','20:15'],['12','20:20','21:05'],['13','21:10','21:55']],types={study:['学习计划','#3569e8'],exercise:['锻炼计划','#19a463'],meal:['吃饭计划','#f59e0b']},planKey='plans-v3',classKey='classes-v1',memKey='memory-v2',$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;let selected=new Date(),plans=JSON.parse(localStorage.getItem(planKey)||'{}'),classes=JSON.parse(localStorage.getItem(classKey)||'{}'),memories=JSON.parse(localStorage.getItem(memKey)||'[]');const todayKey=dateKey(new Date());function key(){return dateKey(selected)}function getPlans(){return plans[key()]||[]}function save(){localStorage.setItem(planKey,JSON.stringify(plans))}function classList(){return classes[key()]||Array(13).fill('')}
function renderSchedule(){const a=classList();$('schedule').innerHTML=periods.map((p,i)=>`<div class="period" style="grid-template-columns:45px 94px 1fr 1fr 1fr 62px 38px"><b>第${p[0]}节</b><small>${p[1]}-${p[2]}</small><input value="${a[i]?.name||a[i]||''}" data-field="name" data-class="${i}" placeholder="课程名称"><input value="${a[i]?.teacher||''}" data-field="teacher" data-class="${i}" placeholder="任课老师"><input value="${a[i]?.room||''}" data-field="room" data-class="${i}" placeholder="教室"><button data-addclass="${i}">加入</button><button data-deleteclass="${i}">删</button></div>`).join('')}
function renderPlans(){const a=getPlans(),g={study:[],exercise:[],meal:[]};a.forEach((x,i)=>g[x.type].push({...x,i}));$('date').textContent=selected.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('dayLabel').textContent=key()===todayKey?'今天':selected<new Date()?'过去的计划':'未来的计划';$('planTitle').textContent=(key()===todayKey?'今天':selected.toLocaleDateString('zh-CN',{month:'long',day:'numeric'}))+'的全部安排';for(const t of ['study','exercise','meal'])$(t+'Count').textContent=g[t].length;$('groups').innerHTML=Object.entries(g).map(([t,arr])=>`<div><div class="group-title"><i class="dot" style="background:${types[t][1]}"></i>${types[t][0]} (${arr.length})</div>${arr.sort((x,y)=>x.time.localeCompare(y.time)).map(x=>`<label class="task ${x.done?'done':''}"><input class="check" type="checkbox" data-i="${x.i}" ${x.done?'checked':''}><span class="main"><span class="time">${x.time}</span><span class="name">${x.name}</span></span><button class="del" data-del="${x.i}">×</button></label>`).join('')||'<div class="hint">暂无安排</div>'}</div>`).join('');renderNext()}
function renderNext(){const n=new Date(),mins=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,a=getPlans().map(x=>({...x,m:+x.time.split(':')[0]*60 + +x.time.split(':')[1]})).filter(x=>!x.done&&(!((key()===todayKey))||x.m>=mins)).sort((x,y)=>x.m-y.m)[0];if(!a){$('nextName').textContent=getPlans().length?'今天的任务已完成':'暂无任务';$('nextInfo').textContent='可以休息一下，或安排其他日期';$('countdown').textContent='—';return}$('nextName').textContent=a.name;$('nextInfo').textContent=a.time+' · '+types[a.type][0];if(key()===todayKey){const s=Math.max(0,Math.round(a.m*60-(n.getHours()*3600+n.getMinutes()*60+n.getSeconds())));$('countdown').textContent=s<60?s+' 秒':Math.floor(s/3600)+' 小时 '+Math.floor(s%3600/60)+' 分钟'}else $('countdown').textContent='距离该日期 '+Math.abs(Math.round((selected-n)/86400000))+' 天'}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dateKey(d)}function renderMemories(){$('memoryRows').innerHTML=memories.length?memories.map((m,mi)=>`<tr><td>${m.name}<br><button data-remove-memory="${mi}">删除</button></td><td>${m.start}</td>${[1,2,4,7,15,30].map(d=>{const day=addDays(m.start,d),due=day===key(),done=m.done?.includes(d);return `<td class="${done?'done':due?'due':''}">${day}<br>${done?'已完成':due?'<b>今天复习</b>':`<button data-memory="${mi}" data-day="${d}">标记完成</button>`}</td>`}).join('')}</tr>`).join(''):'<tr><td colspan="8" class="hint">还没有记忆内容</td></tr>'}
$('add').onclick=()=>{const n=$('name').value.trim();if(!n)return;$('name').value='';(plans[key()]??=[]).push({time:$('time').value||'09:00',name:n,type:$('type').value,done:false});save();renderPlans()};$('prev').onclick=()=>{selected.setDate(selected.getDate()-1);renderSchedule();renderPlans();renderMemories()};$('next').onclick=()=>{selected.setDate(selected.getDate()+1);renderSchedule();renderPlans();renderMemories()};$('addMemory').onclick=()=>{const n=$('memoryName').value.trim(),s=$('memoryDate').value||dateKey(new Date());if(!n)return;memories.push({name:n,start:s,done:[]});localStorage.setItem(memKey,JSON.stringify(memories));$('memoryName').value='';renderMemories()};document.addEventListener('input',e=>{if(e.target.dataset.class!==undefined){const a=classList();a[+e.target.dataset.class]=e.target.value;classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes))}});document.addEventListener('change',e=>{if(e.target.matches('.check')){getPlans()[+e.target.dataset.i].done=e.target.checked;save();renderPlans()}});document.addEventListener('click',e=>{if(e.target.dataset.del!==undefined){getPlans().splice(+e.target.dataset.del,1);save();renderPlans()}if(e.target.dataset.addclass!==undefined){const a=classList(),n=a[+e.target.dataset.addclass];if(n){(plans[key()]??[]).push({time:periods[+e.target.dataset.addclass][1],name:n,type:'study',done:false});save();renderPlans()}}if(e.target.dataset.memory){const m=memories[+e.target.dataset.memory];m.done=m.done||[];m.done.push(+e.target.dataset.day);localStorage.setItem(memKey,JSON.stringify(memories));renderMemories()}if(e.target.dataset.removeMemory!==undefined){memories.splice(+e.target.dataset.removeMemory,1);localStorage.setItem(memKey,JSON.stringify(memories));renderMemories()}});function tick(){$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});renderNext()}$('memoryDate').value=todayKey;renderSchedule();renderPlans();renderMemories();tick();setInterval(tick,1000);
</script></body></html>
</script><script>
function classList2(){const a=classes[key()]||[];return Array.from({length:13},(_,i)=>typeof a[i]==='string'?{name:a[i],teacher:'',room:''}:{name:a[i]?.name||'',teacher:a[i]?.teacher||'',room:a[i]?.room||''})}
function renderSchedule2(){const a=classList2();$('schedule').innerHTML=periods.map((p,i)=>`<div class="period" style="grid-template-columns:45px 94px 1fr 1fr 1fr 62px 38px"><b>第${p[0]}节</b><small>${p[1]}-${p[2]}</small><input value="${a[i].name}" data-field2="name" data-class2="${i}" placeholder="课程名称"><input value="${a[i].teacher}" data-field2="teacher" data-class2="${i}" placeholder="任课老师"><input value="${a[i].room}" data-field2="room" data-class2="${i}" placeholder="教室"><button data-addclass2="${i}">加入</button><button data-deleteclass2="${i}">删</button></div>`).join('')}
document.addEventListener('input',e=>{if(e.target.dataset.class2!==undefined){const a=classList2(),i=+e.target.dataset.class2;a[i][e.target.dataset.field2]=e.target.value;classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes))}});document.addEventListener('click',e=>{if(e.target.dataset.addclass2!==undefined){const i=+e.target.dataset.addclass2,c=classList2()[i];if(c.name){(plans[key()]??=[]).push({time:periods[i][1],name:c.name+(c.teacher?' · '+c.teacher:'')+(c.room?' · '+c.room:''),type:'study',done:false});save();renderPlans()}}if(e.target.dataset.deleteclass2!==undefined){const a=classList2();a[+e.target.dataset.deleteclass2]={name:'',teacher:'',room:''};classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes));renderSchedule2()}});renderSchedule2();
</script>
</script><script>
function courseData(){const raw=classes[key()]||[];return Array.from({length:13},(_,i)=>{const v=raw[i];return typeof v==='string'?{name:v,teacher:'',room:''}:Object.assign({name:'',teacher:'',room:''},v||{})})}
function renderCourseSlots(){const a=courseData();$('schedule').innerHTML=periods.map((p,i)=>{const c=a[i],has=c.name||c.teacher||c.room;return `<div class="period" style="grid-template-columns:45px 94px ${has?'1fr 1fr 1fr 32px':'1fr 32px'}"><b>第${p[0]}节</b><small>${p[1]}-${p[2]}</small>${has?`<input value="${c.name}" data-course-field="name" data-course-i="${i}" placeholder="课程名称"><input value="${c.teacher}" data-course-field="teacher" data-course-i="${i}" placeholder="任课老师"><input value="${c.room}" data-course-field="room" data-course-i="${i}" placeholder="教室"><button data-course-del="${i}" title="删除课程">−</button>`:`<span class="hint" style="text-align:left;padding:0">暂未安排课程</span><button data-course-add="${i}" title="添加课程">＋</button>`}</div>`}).join('')}
document.addEventListener('input',e=>{if(e.target.dataset.courseI!==undefined){const a=courseData(),i=+e.target.dataset.courseI;a[i][e.target.dataset.courseField]=e.target.value;classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes))}},true);document.addEventListener('click',e=>{const add=e.target.dataset.courseAdd,del=e.target.dataset.courseDel;if(add!==undefined){e.preventDefault();e.stopPropagation();const a=courseData();a[+add]={name:'新课程',teacher:'',room:''};classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes));renderCourseSlots();const x=document.querySelector(`[data-course-field="name"][data-course-i="${add}"]`);if(x){x.focus();x.select()}return}if(del!==undefined){e.preventDefault();e.stopPropagation();const a=courseData();a[+del]={name:'',teacher:'',room:''};classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes));renderCourseSlots();return}},true);document.addEventListener('click',e=>{if(e.target.id==='prev'||e.target.id==='next')setTimeout(renderCourseSlots,0)},true);renderCourseSlots();
</script>
</script><script>
function semesterWeek(d){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()),fall=new Date(2026,8,7),spring=new Date(2027,2,1),fallEnd=new Date(2027,0,3),springEnd=new Date(2027,5,27);if(t<fall&&t>=new Date(2026,7,24))return '暑假 / 开学准备（非教学周）';if(t>=fall&&t<=fallEnd)return `第 ${Math.floor((t-fall)/604800000)+1} 教学周`;if(t>fallEnd&&t<spring)return '考试周 / 寒假（非教学周）';if(t>=spring&&t<=springEnd)return `第 ${Math.floor((t-spring)/604800000)+1} 教学周`;if(t>springEnd)return '考试周 / 暑假（非教学周）';return '校历外日期'}
function showSemesterWeek(){const d=document.createElement('small');d.textContent=semesterWeek(selected);d.style='display:block;color:#3569e8;font-size:12px;margin-top:2px';$('date').innerHTML=selected.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('date').appendChild(d)}document.addEventListener('click',e=>{if(e.target.id==='prev'||e.target.id==='next')setTimeout(showSemesterWeek,0)},true);showSemesterWeek();
</script>

const manifest=document.createElement('link');manifest.rel='manifest';manifest.href='manifest.json';document.head.appendChild(manifest);const theme=document.createElement('meta');theme.name='theme-color';theme.content='#3569e8';document.head.appendChild(theme);if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');

<style>@media(max-width:600px){.period{display:block!important;padding:14px 0}.period input{display:block!important;width:100%!important;height:44px;margin:8px 0;font-size:16px}.period label{display:block!important;font-size:12px;color:#718096}.period button{padding:9px 12px;margin:4px 5px 0 0;font-size:13px}}</style><script>function finalRows(){var r=classes[key()]||[];return Array.from({length:13},function(_,i){var v=r[i];return typeof v==='string'?{name:v,teacher:'',room:'',extra:'',active:!!v}:Object.assign({name:'',teacher:'',room:'',extra:'',active:false},v||{})})}function finalDraw(){var a=finalRows();$('schedule').innerHTML=periods.map(function(p,i){var c=a[i],h=c.active||c.name||c.teacher||c.room||c.extra;return '<div class="period"><b>第'+p[0]+'节</b> <small>'+p[1]+'-'+p[2]+'</small>'+(h?'<label>课程名称<input value="'+c.name+'" data-fi="'+i+'" data-ff="name" placeholder="填写课程名称"></label><label>任课老师<input value="'+c.teacher+'" data-fi="'+i+'" data-ff="teacher" placeholder="填写任课老师"></label><label>教室<input value="'+c.room+'" data-fi="'+i+'" data-ff="room" placeholder="填写教室"></label><label>补充信息<input value="'+c.extra+'" data-fi="'+i+'" data-ff="extra" placeholder="单双周、考试要求等"></label><button data-fdel="'+i+'">− 删除课程</button>':'<span class="hint">暂未安排课程</span><button data-fadd="'+i+'">＋ 添加课程</button>')+'</div>'}).join('')}document.addEventListener('input',function(e){if(e.target.dataset.fi!==undefined){var a=finalRows(),i=+e.target.dataset.fi;a[i][e.target.dataset.ff]=e.target.value;a[i].active=true;classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes))}},true);document.addEventListener('click',function(e){if(e.target.dataset.fadd!==undefined){var a=finalRows();a[+e.target.dataset.fadd].active=true;classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes));finalDraw()}if(e.target.dataset.fdel!==undefined){var a=finalRows();a[+e.target.dataset.fdel]={name:'',teacher:'',room:'',extra:'',active:false};classes[key()]=a;localStorage.setItem(classKey,JSON.stringify(classes));finalDraw()}if(e.target.id==='prev'||e.target.id==='next')setTimeout(finalDraw,0)},true);finalDraw();</script>
