<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3569e8">
<link rel="manifest" href="manifest.json">
<title>我的每日计划</title>
<style>
:root{--blue:#3569e8;--ink:#172033;--muted:#718096;--bg:#f5f7fb;--card:#fff;--line:#e6ebf2;--green:#16834b;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.app{max-width:720px;margin:auto;padding:18px 16px 48px}.top,.days{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:var(--blue);font-weight:800;font-size:12px;letter-spacing:1px}.top h1{margin:2px 0 0;font-size:27px}.clock{text-align:right;color:var(--muted);font-size:12px}.clock strong{display:block;color:var(--ink);font-size:22px}.days{gap:8px;margin:18px 0 14px}.days button,.btn{border:0;border-radius:10px;padding:9px 12px;background:#e8edf8;color:#52617a;cursor:pointer}.datebox{text-align:center}.date{font-weight:800;font-size:17px}.week{display:block;color:var(--blue);font-size:12px;margin-top:2px}.hero{background:linear-gradient(135deg,#3468e8,#5b4ddd);color:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 28px #3156c530}.hero p{margin:0;color:#e5edff}.hero h2{margin:4px 0 8px;font-size:23px}.count{margin-top:15px;padding:11px;border:1px solid #ffffff45;border-radius:13px;background:#ffffff20}.count strong{display:block;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px}.card h2{font-size:17px;margin:0 0 10px}.hint{color:var(--muted);font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}.stat{background:#f5f7fb;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:12px}.schedule{display:grid;gap:9px}.period{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.period-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.period-head b{min-width:54px}.period-head small{color:var(--muted);font-size:13px}.period-fields{display:grid;gap:7px}.period label{font-size:12px;color:var(--muted)}input,select{font:inherit;border:1px solid #ccd5e4;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none;width:100%}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3569e81c}.period button,.memory-actions button{border:0;border-radius:8px;padding:8px 10px;cursor:pointer}.add-course{background:#eef2ff;color:var(--blue)}.del-course{background:#fff0f0;color:var(--red)}.plan-form{display:grid;grid-template-columns:105px 1fr 100px auto;gap:8px;align-items:center}.plan-groups{display:grid;gap:10px}.plan-group{border-radius:12px;padding:11px;background:#f8faff}.plan-group h3{font-size:14px;margin:0 0 7px}.plan-item{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.plan-item small{color:var(--muted);white-space:nowrap}.memory-wrap{overflow:visible}.memory-table{width:100%;border-collapse:separate;border-spacing:0 8px}.memory-table th{color:var(--muted);font-size:12px;text-align:left;padding:0 9px}.memory-table td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 9px;vertical-align:top}.memory-table td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px;font-weight:700}.memory-table td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}.memory-cell{display:flex;flex-direction:column;gap:5px}.memory-cell small{color:var(--muted)}.memory-done{background:#effaf3!important;color:var(--green);font-weight:700}.memory-done small{color:var(--green)}.memory-actions{display:flex;gap:6px;flex-wrap:wrap}.memory-actions button{background:#eef2ff;color:var(--blue);font-size:12px}.memory-done button{background:#ffe8e8;color:var(--red)}.delete-memory{background:#fff0f0!important;color:var(--red)!important}.empty{padding:18px;text-align:center;color:var(--muted)}
@media(max-width:600px){.app{padding:16px 12px 40px}.top h1{font-size:24px}.plan-form{grid-template-columns:1fr 1fr}.plan-form input:first-child{grid-column:1}.plan-form input:nth-child(2){grid-column:2}.plan-form select{grid-column:1}.plan-form button{grid-column:2}.memory-table,.memory-table thead,.memory-table tbody,.memory-table tr,.memory-table td{display:block;width:100%}.memory-table thead{display:none}.memory-table tr{margin:10px 0;padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:#fff}.memory-table td{border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:9px 0;background:transparent}.memory-table td:first-child{font-size:16px;padding-top:0}.memory-table td:last-child{border-bottom:0!important}.memory-cell{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}.memory-cell small{font-size:13px}.memory-actions{justify-content:flex-end}.memory-actions button{padding:7px 9px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="eyebrow">MY DAILY PLAN</div><h1>每日计划</h1></div><div class="clock">当前时间<strong id="clock">--:--:--</strong></div></header>
<nav class="days"><button id="prev">‹ 前一天</button><div class="datebox"><div id="date" class="date"></div><span id="week" class="week"></span></div><button id="next">后一天 ›</button></nav>
<section class="hero"><p id="todayLabel">今天</p><h2 id="nextName">暂无任务</h2><p>距离下一项任务</p><div class="count"><strong id="countdown">—</strong><span id="nextTime"></span></div></section>
<section class="card"><h2 id="scheduleTitle">当天课程表</h2><p class="hint">每个时间段都保留，可自行添加或删除课程。</p><div id="schedule" class="schedule"></div></section>
<section class="card"><h2 id="planTitle">今天的全部安排</h2><div class="summary"><div class="stat"><b id="studyCount">0</b><span>学习</span></div><div class="stat"><b id="exerciseCount">0</b><span>锻炼</span></div><div class="stat"><b id="eatCount">0</b><span>吃饭</span></div></div><div class="plan-form"><input id="planTime" type="time" value="09:00"><input id="planName" placeholder="填写计划内容"><select id="planType"><option value="学习">学习</option><option value="锻炼">锻炼</option><option value="吃饭">吃饭</option></select><button class="btn" id="addPlan">＋ 添加</button></div><div id="planGroups" class="plan-groups"></div></section>
<section class="card"><h2>艾宾浩斯复习表</h2><p class="hint">填入哪天学了什么，系统自动计算复习日期。每一行独立操作。</p><div class="plan-form"><input id="memoryDate" type="date"><input id="memoryName" placeholder="例如：英语单词 Unit 1"><span></span><button class="btn" id="addMemory">添加</button></div><div class="memory-wrap"><table class="memory-table"><thead><tr><th>内容</th><th>首次学习</th><th>+1天</th><th>+2天</th><th>+4天</th><th>+7天</th><th>+15天</th><th>+30天</th></tr></thead><tbody id="memoryRows"></tbody></table></div></section>
</main>
<script>
const CLOUD_URL='https://reilqxvnkqmmeqtsuqgq.supabase.co',CLOUD_KEY='sb_publishable_vhQc7xKDkNyWvXVxBkZdIw_tdaPwSNN',CLOUD_ROW='shared',REVIEW_DAYS=[1,2,4,7,15,30],PERIODS=[['01','08:00','08:45'],['02','08:50','09:35'],['03','09:50','10:35'],['04','10:40','11:25'],['05','11:30','12:15'],['06','14:00','14:45'],['07','14:50','15:35'],['08','15:40','16:25'],['09','16:40','17:25'],['10','17:30','18:15'],['11','19:30','20:15'],['12','20:20','21:05'],['13','21:10','21:55']];
const $=id=>document.getElementById(id),today=new Date();let selected=strip(today),plans=read('plans-v3',{}),classes=read('classes-v1',{}),memories=normalizeMemories(read('memory-v2',[])),pushTimer=0,remoteSig='',pendingSig='',pushBusy=false;
function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}
function normalizeMemories(a){const fallback=new Date().toISOString().slice(0,10);return Array.isArray(a)?a.map(m=>Object.assign({id:uid(),name:'',start:fallback,done:[]},m,{id:m.id||uid(),done:Array.isArray(m.done)?m.done:[]})):[]}
function strip(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function key(d=selected){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function addDays(s,n){const [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d+n);return key(x)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function rawSet(k,v){Storage.prototype.setItem.call(localStorage,k,JSON.stringify(v))}
function snapshot(){return JSON.stringify({'plans-v3':plans,'classes-v1':classes,'memory-v2':memories})}
function save(){rawSet('plans-v3',plans);rawSet('classes-v1',classes);rawSet('memory-v2',memories);pendingSig=snapshot();schedulePush()}
function schedulePush(delay=120){clearTimeout(pushTimer);pushTimer=setTimeout(push,delay)}
async function push(){if(pushBusy)return;const sig=pendingSig||snapshot();pushBusy=true;try{const data={'plans-v3':plans,'classes-v1':classes,'memory-v2':memories};const r=await fetch(CLOUD_URL+'/rest/v1/app_state?on_conflict=id',{method:'POST',headers:{apikey:CLOUD_KEY,Authorization:'Bearer '+CLOUD_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id:CLOUD_ROW,data,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error('sync failed');remoteSig=sig;if(pendingSig===sig)pendingSig=''}catch(e){schedulePush(2500)}finally{pushBusy=false;if(pendingSig&&pendingSig!==sig)schedulePush(120)}}
async function pull(){if(pushBusy||pendingSig)return;try{const r=await fetch(CLOUD_URL+'/rest/v1/app_state?id=eq.'+CLOUD_ROW,{headers:{apikey:CLOUD_KEY,Authorization:'Bearer '+CLOUD_KEY}}),rows=await r.json(),data=rows[0]?.data;if(!data)return;const sig=JSON.stringify(data);if(!remoteSig){remoteSig=sig;plans=data['plans-v3']||{};classes=data['classes-v1']||{};memories=normalizeMemories(data['memory-v2']||[]);persistRemote();renderAll();return}if(sig!==remoteSig){remoteSig=sig;plans=data['plans-v3']||{};classes=data['classes-v1']||{};memories=normalizeMemories(data['memory-v2']||[]);persistRemote();renderAll()}}catch(e){}}
function persistRemote(){rawSet('plans-v3',plans);rawSet('classes-v1',classes);rawSet('memory-v2',memories)}
function semesterWeek(d){const fall=new Date(2026,8,7),spring=new Date(2027,2,1),fallEnd=new Date(2027,0,3),springEnd=new Date(2027,5,27);if(d>=fall&&d<=fallEnd)return '第 '+(Math.floor((d-fall)/604800000)+1)+' 教学周';if(d>=spring&&d<=springEnd)return '第 '+(Math.floor((d-spring)/604800000)+1)+' 教学周';if(d>=new Date(2026,7,24)&&d<fall)return '开学准备阶段';return '校历外日期'}
function renderHeader(){const d=selected;$('date').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('week').textContent=semesterWeek(d);$('todayLabel').textContent=key(d)===key(strip(today))?'今天':key(d)<key(strip(today))?'以前的日期':'以后的日期';$('planTitle').textContent=key(d)===key(strip(today))?'今天的全部安排':d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+'的全部安排';$('scheduleTitle').textContent='当天课程表（'+d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+'）'}
function courseList(){const a=classes[key()]||[];return Array.from({length:13},(_,i)=>{const v=a[i];return typeof v==='string'?{name:v,teacher:'',room:'',extra:'',active:!!v}:Object.assign({name:'',teacher:'',room:'',extra:'',active:false},v||{})})}
function renderSchedule(){const a=courseList();$('schedule').innerHTML=PERIODS.map((p,i)=>{const c=a[i],has=c.active||c.name||c.teacher||c.room||c.extra;return '<div class="period"><div class="period-head"><b>第'+p[0]+'节</b><small>'+p[1]+'-'+p[2]+'</small></div>'+(has?'<div class="period-fields"><label>课程名称<input data-course="name" data-i="'+i+'" value="'+esc(c.name)+'" placeholder="填写课程名称"></label><label>任课老师<input data-course="teacher" data-i="'+i+'" value="'+esc(c.teacher)+'" placeholder="填写任课老师"></label><label>教室<input data-course="room" data-i="'+i+'" value="'+esc(c.room)+'" placeholder="填写教室"></label><label>补充信息<input data-course="extra" data-i="'+i+'" value="'+esc(c.extra)+'" placeholder="单双周、考试要求等"></label><button class="del-course" data-delete-course="'+i+'">− 删除课程</button></div>':'<div class="period-head"><span class="hint">暂未安排课程</span><button class="add-course" data-add-course="'+i+'">＋ 添加课程</button></div>')+'</div>'}).join('')}
function renderPlans(){const list=(plans[key()]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time)),groups=['学习','锻炼','吃饭'];$('studyCount').textContent=list.filter(x=>x.type==='学习').length;$('exerciseCount').textContent=list.filter(x=>x.type==='锻炼').length;$('eatCount').textContent=list.filter(x=>x.type==='吃饭').length;$('planGroups').innerHTML=groups.map(g=>{const arr=list.filter(x=>x.type===g);return '<div class="plan-group"><h3>'+g+'计划（'+arr.length+'）</h3>'+(arr.length?arr.map(x=>'<div class="plan-item"><span>'+esc(x.name)+'</span><small>'+x.time+'</small></div>').join(''):'<div class="hint">暂无安排</div>')+'</div>'}).join('')}
function renderMemories(){const rows=$('memoryRows');if(!memories.length){rows.innerHTML='<tr><td colspan="8" class="empty">还没有记忆内容</td></tr>';return}rows.innerHTML=memories.map(m=>'<tr><td><div class="memory-cell"><b>'+esc(m.name)+'</b><div class="memory-actions"><button class="delete-memory" data-delete-memory="'+m.id+'">删除</button></div></div></td><td><div class="memory-cell"><small>首次学习</small><span>'+m.start+'</span></div></td>'+REVIEW_DAYS.map(d=>{const date=addDays(m.start,d),done=(m.done||[]).includes(d);return '<td class="'+(done?'memory-done':'')+'"><div class="memory-cell"><small>+'+d+'天复习</small><span>'+date+'</span><div class="memory-actions"><button data-toggle-memory="'+m.id+'" data-day="'+d+'">'+(done?'取消完成':'标记完成')+'</button></div></div></td>'}).join('')+'</tr>').join('')}
function renderNext(){const now=new Date(),arr=(plans[key(strip(today))]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time)),next=arr.find(x=>{const [h,m]=x.time.split(':').map(Number);return h*60+m>=now.getHours()*60+now.getMinutes()});if(!next){$('nextName').textContent='暂无任务';$('countdown').textContent='—';$('nextTime').textContent='今天的安排已完成';return}const t=new Date();const [h,m]=next.time.split(':').map(Number);t.setHours(h,m,0,0);let diff=Math.max(0,t-now),mins=Math.floor(diff/60000),hours=Math.floor(mins/60);mins%=60;$('nextName').textContent=next.name;$('countdown').textContent=hours+'小时'+mins+'分钟';$('nextTime').textContent='开始时间 '+next.time}
function renderAll(){renderHeader();renderSchedule();renderPlans();renderMemories();renderNext()}
$('prev').onclick=()=>{selected.setDate(selected.getDate()-1);renderAll()};$('next').onclick=()=>{selected.setDate(selected.getDate()+1);renderAll()};$('addPlan').onclick=()=>{const name=$('planName').value.trim();if(!name)return;$('planName').value='';(plans[key()]??=[]).push({id:uid(),time:$('planTime').value||'09:00',name,type:$('planType').value});save();renderPlans();renderNext()};$('addMemory').onclick=()=>{const name=$('memoryName').value.trim(),start=$('memoryDate').value;if(!name||!start)return;memories.push({id:uid(),name,start,done:[]});$('memoryName').value='';save();renderMemories()};
document.addEventListener('click',e=>{const add=e.target.closest('[data-add-course]');if(add){const a=courseList();a[+add.dataset.addCourse].active=true;classes[key()]=a;save();renderSchedule();return}const del=e.target.closest('[data-delete-course]');if(del){const a=courseList();a[+del.dataset.deleteCourse]={name:'',teacher:'',room:'',extra:'',active:false};classes[key()]=a;save();renderSchedule();return}const toggle=e.target.closest('[data-toggle-memory]');if(toggle){const m=memories.find(x=>x.id===toggle.dataset.toggleMemory);if(!m)return;m.done=m.done||[];const d=+toggle.dataset.day,i=m.done.indexOf(d);if(i<0)m.done.push(d);else m.done.splice(i,1);save();renderMemories();return}const dm=e.target.closest('[data-delete-memory]');if(dm){memories=memories.filter(x=>x.id!==dm.dataset.deleteMemory);save();renderMemories()}},true);
document.addEventListener('input',e=>{const field=e.target.closest('[data-course]');if(!field)return;const a=courseList(),i=+field.dataset.i;a[i][field.dataset.course]=field.value;a[i].active=true;classes[key()]=a;save()},true);
function tick(){const n=new Date();$('clock').textContent=n.toLocaleTimeString('zh-CN',{hour12:false});renderNext()}$('memoryDate').value=key(strip(today));renderAll();tick();setInterval(tick,1000);setInterval(pull,2000);pull();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
