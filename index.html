function syncCourses(mode,slot,sourceDate=key()){const [y,m,d]=sourceDate.split('-').map(Number),sourceDay=new Date(Date.UTC(y,m-1,d)),info=semesterInfo(sourceDay),source=courseList(sourceDate),sources=mode==='course'&&Number.isInteger(slot)?[[slot,source[slot]]]:source.map((course,index)=>[index,course]).filter(([,course])=>courseHas(course));if(!info){$('syncStatus').textContent='当前日期不在第1至第17教学周内';return}if(!sources.length){$('syncStatus').textContent='没有可以同步的课程';return}const dates=teachingDates(sourceDay).filter(date=>date!==sourceDate),placements=dates.flatMap(date=>sources.map(([index,course])=>({date,index,course,occupied:courseHas(courseList(date)[index])}))),conflicts=placements.filter(x=>x.occupied).length,empty=placements.length-conflicts,conflictDates=[...new Set(placements.filter(x=>x.occupied).map(x=>x.date))],clearDates=dates.filter(date=>!conflictDates.includes(date));openEditor(mode==='course'?'同步当前课程':'同步当天课程','',(unused,extra)=>{for(const date of dates){const target=courseList(date);for(const [index,course] of sources)if(extra.policy==='overwrite'||!courseHas(target[index]))target[index]={name:course.name,teacher:course.teacher,room:course.room,extra:course.extra,active:true,done:false};classes[date]=target}save();renderSchedule();$('syncStatus').textContent='已同步到'+dates.length+'个其他教学周'},[{name:'policy',label:'冲突处理',type:'select',value:'empty',required:true,options:[{value:'empty',label:'仅填充空时间段（推荐）'},{value:'overwrite',label:'覆盖已有课程'}]}],true);$('dialogExtra').insertAdjacentHTML('afterbegin','<div class="sync-note"><b>'+esc(info.name)+' · 同一星期 · 共'+dates.length+'个其他教学周</b>将处理'+placements.length+'个课程位置：'+empty+'个为空，'+conflicts+'个已有课程。完成状态不会同步。<br>无冲突日期：'+(clearDates.join('、')||'无')+'<br>已有课程日期：'+(conflictDates.join('、')||'无')+'</div>')}
document.addEventListener('click',e=>{const pressed=e.target.closest('button');if(pressed)feedback(pressed.classList.contains('danger')||pressed.id==='dialogSave'&&deleteMode?'danger':pressed.matches('[data-toggle-plan],[data-toggle-course],[data-toggle-memory],[data-add-plan],[data-add-memory]')?'success':'tap');const open=e.target.closest('[data-open-menu]');if(open){const menu=open.closest('.action-wrap').querySelector('.action-menu'),show=!menu.classList.contains('open');closeMenus();if(show)menu.classList.add('open');return}if(!e.target.closest('.action-wrap'))closeMenus();const detail=e.target.closest('[data-course-detail]');if(detail){openCourseDetail(detail.dataset.date,+detail.dataset.courseDetail);return}const syncDay=e.target.closest('[data-sync-day]');if(syncDay){syncCourses('day',null,key());return}const newPlan=e.target.closest('[data-add-plan]');if(newPlan){addPlan();return}const newMemory=e.target.closest('[data-add-memory]');if(newMemory){addMemory();return}const manageMemory=e.target.closest('[data-manage-memory]');if(manageMemory){uiState.memoryOpen=!uiState.memoryOpen;saveUi();renderMemories();return}const group=e.target.closest('[data-toggle-group]');if(group){const type=group.dataset.toggleGroup;uiState.groups[type]=group.getAttribute('aria-expanded')!=='true';saveUi();renderPlans();return}const add=e.target.closest('[data-add-course]');if(add){editCourse(+add.dataset.addCourse,add.dataset.date);return}const courseToPlan=e.target.closest('[data-course-to-plan]');if(courseToPlan){const date=courseToPlan.dataset.date||key(),i=+courseToPlan.dataset.courseToPlan,c=courseList(date)[i];if(!c?.name?.trim())return;if($('courseDetailDialog').open)$('courseDetailDialog').close();(plans[date]??=[]).push({id:uid(),time:PERIODS[i][1],name:c.name.trim(),type:'学习',done:false});uiState.groups['学习']=true;saveUi();save();renderPlans();renderNext();return}const toggleCourse=e.target.closest('[data-toggle-course]');if(toggleCourse){const date=toggleCourse.dataset.date||key(),a=courseList(date),i=+toggleCourse.dataset.toggleCourse;if($('courseDetailDialog').open)$('courseDetailDialog').close();a[i].done=!a[i].done;classes[date]=a;save();renderSchedule();return}const syncCourse=e.target.closest('[data-sync-course]');if(syncCourse){const date=syncCourse.dataset.date||key();if($('courseDetailDialog').open)$('courseDetailDialog').close();syncCourses('course',+syncCourse.dataset.syncCourse,date);return}const editButton=e.target.closest('[data-edit-course]');if(editButton){const date=editButton.dataset.date||key();if($('courseDetailDialog').open)$('courseDetailDialog').close();editCourse(+editButton.dataset.editCourse,date);return}const delCourse=e.target.closest('[data-delete-course]');if(delCourse){const date=delCourse.dataset.date||key(),slot=+delCourse.dataset.deleteCourse;if($('courseDetailDialog').open)$('courseDetailDialog').close();askDelete('确定删除这个时间段的课程吗？',()=>{const a=courseList(date);a[slot]={name:'',teacher:'',room:'',extra:'',active:false,done:false};classes[date]=a;save();renderSchedule()});return}const togglePlan=e.target.closest('[data-toggle-plan]');if(togglePlan){const p=(plans[key()]||[]).find(x=>x.id===togglePlan.dataset.togglePlan);if(!p)return;p.done=!p.done;save();renderPlans();renderNext();return}const editPlan=e.target.closest('[data-edit-plan]');if(editPlan){const p=(plans[key()]||[]).find(x=>x.id===editPlan.dataset.editPlan);if(!p)return;openEditor('修改计划',p.name,(v,extra)=>{p.name=v;p.time=extra.time;p.type=extra.type;save();renderPlans();renderNext()},[{name:'time',label:'开始时间',type:'time',value:p.time,required:true},{name:'type',label:'计划类型',type:'select',value:p.type,required:true}]);return}const delPlan=e.target.closest('[data-delete-plan]');if(delPlan){const date=key(),id=delPlan.dataset.deletePlan;askDelete('确定删除这条计划吗？',()=>{plans[date]=(plans[date]||[]).filter(x=>x.id!==id);save();renderPlans();renderNext()});return}const editMem=e.target.closest('[data-edit-memory]');if(editMem){const m=memories.find(x=>x.id===editMem.dataset.editMemory);if(!m)return;openEditor('修改记忆',m.name,(v,extra)=>{m.name=v;if(m.start!==extra.start)m.done=[];m.start=extra.start;save();renderMemories()},[{name:'start',label:'首次学习日期',type:'date',value:m.start,required:true}]);return}const toggle=e.target.closest('[data-toggle-memory]');if(toggle){const m=memories.find(x=>x.id===toggle.dataset.toggleMemory);if(!m)return;m.done=m.done||[];const d=+toggle.dataset.day,i=m.done.indexOf(d);if(i<0)m.done.push(d);else m.done.splice(i,1);save();renderMemories();return}const dm=e.target.closest('[data-delete-memory]');if(dm){const id=dm.dataset.deleteMemory;askDelete('确定删除这条记忆及其复习记录吗？',()=>{memories=memories.filter(x=>x.id!==id);save();renderMemories()})}},false);


let editorCallback=null,editorOrigin=null,editorFields=[],composing=false,deleteMode=false;
function askDelete(title,callback){openEditor(title,'',()=>callback(),[],true);deleteMode=true;$('editDialog').classList.add('confirm-dialog');$('dialogSave').textContent='确认删除';$('dialogCancel').focus()}
function openEditor(title,value,callback,fields=[],hideMain=false){closeMenus();editorOrigin=document.activeElement;editorCallback=callback;editorFields=fields;deleteMode=false;$('editDialog').classList.remove('confirm-dialog');$('dialogTitle').textContent=title;$('dialogValue').value=value;$('dialogValue').required=!hideMain;$('dialogLabel').hidden=hideMain;$('dialogError').textContent='';$('dialogSave').textContent='保存';$('dialogExtra').innerHTML=fields.map(field=>'<label>'+esc(field.label)+(field.type==='select'?'<select name="'+field.name+'" '+(field.required?'required':'')+'>'+((field.options||[{value:'学习',label:'学习'},{value:'锻炼',label:'锻炼'},{value:'吃饭',label:'吃饭'}]).map(option=>'<option value="'+esc(option.value)+'"'+(field.value===option.value?' selected':'')+'>'+esc(option.label)+'</option>').join(''))+'</select>':'<input name="'+field.name+'" type="'+field.type+'" value="'+esc(field.value)+'" '+(field.required?'required':'')+'>')+'</label>').join('');$('editDialog').showModal();(hideMain?$('dialogExtra').querySelector('input,select'):$('dialogValue'))?.focus()}
function closeEditor(){editorCallback=null;editorFields=[];deleteMode=false;$('editDialog').classList.remove('confirm-dialog');$('dialogLabel').hidden=false;$('dialogValue').required=true;$('dialogExtra').replaceChildren();$('editDialog').close();editorOrigin?.focus?.()}
$('dialogCancel').onclick=closeEditor;
$('editDialog').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});
$('editDialog').addEventListener('compositionstart',()=>composing=true);
$('editDialog').addEventListener('compositionend',()=>composing=false);
$('editForm').addEventListener('submit',e=>{e.preventDefault();if(composing)return;const value=$('dialogValue').value.trim();if(!deleteMode&&!$('dialogLabel').hidden&&!value){$('dialogError').textContent='请输入内容';$('dialogValue').focus();return}const extra={};for(const field of editorFields){const input=$('dialogExtra').querySelector('[name="'+field.name+'"]');if(field.required&&!input?.value.trim()){$('dialogError').textContent='请填写'+field.label;input?.focus();return}extra[field.name]=input?.value||''}const cb=editorCallback;closeEditor();cb?.(value,extra)});
if(localStorage.getItem('daily-plan-pending')){pendingSig=snapshot();schedulePush(100)}
window.addEventListener('online',()=>{if(pendingSig)schedulePush(0);else pull()});

function tick(){const current=beijingToday();if(key(current)!==key(today)){const showingToday=key(selected)===key(today);today=current;if(showingToday)selected=new Date(today);renderAll()}$('realDate').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());$('clock').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());renderNext()}applyFeedbackSettings();renderAll();tick();setInterval(tick,1000);setInterval(pull,2000);pull();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
